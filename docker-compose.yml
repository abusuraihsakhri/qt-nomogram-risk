services:
  qt-nomogram-risk:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUDIT_SECRET_KEY: "${AUDIT_SECRET_KEY:?Set AUDIT_SECRET_KEY before startup}"
      API_ACCESS_TOKEN: "${API_ACCESS_TOKEN:?Set API_ACCESS_TOKEN before startup}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
